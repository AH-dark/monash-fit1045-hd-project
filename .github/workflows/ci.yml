name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find server client-cli shared \
            -type f \( -name "*.hpp" -o -name "*.cpp" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  build-lint:
    name: Build & clang-tidy (linux/amd64, Debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: conan-io/setup-conan@v1
      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.conan2/p/
            ~/.conan2/b/
          key: conan-ubuntu-24.04-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: conan-ubuntu-24.04-
      - name: Conan profile detect
        run: conan profile detect --force
      - name: Install dependencies
        run: conan install . --profile=conan_profiles/dev-linux --build=missing -of=build/debug
      - name: Configure CMake
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: clang-tidy
        run: ./scripts/lint.sh
      - name: Test
        run: ctest --preset debug --output-on-failure

  client-web:
    name: client-web (build & test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun --bun run check
      - run: bunx tsc --noEmit
      - run: bun --bun run test
      - env:
          VITE_GRPC_WEB_URL: http://localhost:8080
        run: bun --bun run build
